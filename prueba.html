<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <title>Table Event Handler</title>
</head>
<body>
<table id="colorTable" class="m-1 p-1 table table-bordered">
    <tbody>
    <tr>
        <td id="11">Jon</td>
        <td id="12">Doe</td>
        <td id="13" class="bg-info">12</td>
        <td id="14">2</td>
    </tr>
    <tr>
        <td id="21">Jane</td>
        <td id="22">Done</td>
        <td id="23">3</td>
        <td id="24">34</td>
    </tr>
    <tr>
        <td id="31">Foo</td>
        <td id="32">Bar</td>
        <td id="33">33</td>
        <td id="34">35</td>
    </tr>
    </tbody>
</table>

<div id="container" class="m-1 p-1 border border-success border-1">
    <p class="pink">Tag: <span id="tag"></span></p>
    <p>ID: <span id="cell-id"></span></p>
    <p>Cell: <span id="text-content"></span></p>
    <p>Row: <span id="row-content"></span></p>
    <p>Column: <span id="column-content"></span></p>
</div>

<script>
    document.getElementById('colorTable').addEventListener('click', (event) =>{
        const targetCell = event.target;
        const tag = targetCell.tagName.toLowerCase();
        const cellId = targetCell.id;
        const textContent = targetCell.textContent;
        const colIndex = targetCell.cellIndex;

        const tdInfo = {
            tag: tag,
            id: cellId,
            textContent: textContent,
            rowContent: Array.from(targetCell.parentNode.cells).map(cell => cell.textContent).join(', '),
            columnContent: Array.from(document.querySelectorAll(`#colorTable tr td:nth-child(${colIndex + 1})`)).map(cell => cell.textContent)
        };


        for (let row of document.querySelectorAll("#colorTable tr")) {
            console.log( row.children[colIndex].textContent);
        }

        document.getElementById('tag').textContent = tdInfo.tag;
        document.getElementById('cell-id').textContent = tdInfo.id;
        document.getElementById('text-content').textContent = tdInfo.textContent;
        document.getElementById('row-content').textContent = tdInfo.rowContent;
        document.getElementById('column-content').textContent = tdInfo.columnContent.join(', ');

        document.querySelectorAll('#colorTable td').forEach(cell => cell.classList="");
        // row
        for (let cell of targetCell.parentNode.children) {
            cell.classList.add('bg-secondary');
        }
        // column
        for (let row of document.querySelectorAll("#colorTable tr")) {
            console.log("row",row)
            row.children[colIndex].classList.add("bg-secondary")
        }

        targetCell.classList="";
        if (event.ctrlKey) {
            targetCell.classList.add('bg-danger');
        } else if (event.shiftKey) {
            targetCell.classList.add('bg-info');
        } else {
            targetCell.classList.add('bg-success');
        }
    });
</script>

</body>
</html>
