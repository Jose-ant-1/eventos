<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datos de Matrícula</title>
    <script type="module" src="index.js"></script>
</head>
<body>

<div>
    <header>
        <h2>Datos de matrícula</h2>
    </header>

    <p>Centro docente en el que se matricula:</p>

    <form action="#" method="POST">
        <label for="provincia">Provincia</label>
        <select name="provincia" id="provincia">
            <option value="" selected>Seleccione una provincia</option>
        </select>
        <label for="municipio">Municipio</label>
        <select name="municipio" id="municipio">
            <option value="" selected>Seleccione un municipio</option>
        </select>
        <br>
        <label for="centro">Centro: </label>
        <select name="centro" id="centro">
            <option value="" selected>Seleccione un centro</option>
        </select>
        <br>
        <label for="ensenyanza">Enseñanza: </label>
        <select name="ensenyanza" id="ensenyanza">
            <option value="" selected>Seleccione una enseñanza</option>
        </select>
        <label for="curso">Curso: </label>
        <select name="curso" id="curso">
            <option value="" selected>Seleccione un curso</option>
        </select>

    </form>
</div>

</body>
</html>
